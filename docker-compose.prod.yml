services:
  db:
    image: postgres:16-alpine
    container_name: artigida-prod-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-artigida}
      POSTGRES_USER: ${POSTGRES_USER:-artigida_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-artigida_secret}
    # Exposing the port is optional, commented out for production security
    # ports:
    #   - "5432:5432"
    volumes:
      - artigida_prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artigida_app} -d ${POSTGRES_DB:-artigida}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-dotnet:
    build:
      context: ./backend-dotnet
      dockerfile: Dockerfile
    container_name: artigida-prod-dotnet
    restart: always
    depends_on:
      db:
        condition: service_healthy
    # Internal port only, exposed through Nginx Gateway
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${POSTGRES_DB:-artigida};Username=${POSTGRES_USER:-artigida_app};Password=${POSTGRES_PASSWORD:-artigida_secret}
      - ASPNETCORE_ENVIRONMENT=Production
      - OpenRouter__ApiKey=${OPENROUTER_API_KEY:-}
      - OpenRouter__Model=${OPENROUTER_MODEL:-google/gemini-2.5-flash}
      - JwtSettings__Secret=${JWT_SECRET_KEY:-artigida-production-secure-key-replace}
      - CorsOrigins=${CORS_ORIGINS:-*}

  backend-python:
    build:
      context: ./backend-python
      dockerfile: Dockerfile
    container_name: artigida-prod-python
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-artigida_app}:${POSTGRES_PASSWORD:-artigida_secret}@db:5432/${POSTGRES_DB:-artigida}
      - APP_ENV=production
      - DEBUG=false
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-artigida-production-secure-key-replace}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: artigida-prod-frontend
    restart: always
    depends_on:
      - backend-dotnet

  nginx:
    image: nginx:alpine
    container_name: artigida-prod-gateway
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend-dotnet

volumes:
  artigida_prod_pgdata:
